name = "rusapp-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Segredo (NÃO fica aqui): APP_TOKEN  → ver DEPLOY.md
[vars]
ALLOWED_ORIGIN = "https://rusapp.pages.dev"   # em produção, troque pela URL do Pages (ex.: https://rusapp.pages.dev)

[[d1_databases]]
binding = "DB"
database_name = "rusapp"
database_id = "984141b1-413c-4b52-bfe4-5f5bc30763c4"   # substitua pelo id retornado por `wrangler d1 create rusapp`
migrations_dir = "migrations"
