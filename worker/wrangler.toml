name = "rusapp-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Secrets (NÃO ficam aqui): APP_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID  → ver DEPLOY.md
[vars]
ALLOWED_ORIGIN = "*"   # em produção, troque pela URL do Pages (ex.: https://rusapp.pages.dev)

[[d1_databases]]
binding = "DB"
database_name = "rusapp"
database_id = "00000000-0000-0000-0000-000000000000"   # substitua pelo id retornado por `wrangler d1 create rusapp`
migrations_dir = "migrations"

[triggers]
crons = ["*/30 * * * *"]   # lembretes externos (só agem se ativados no app e com TELEGRAM_* definidos)
